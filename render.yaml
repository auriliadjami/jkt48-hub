services:
  - type: web
    name: jkt48hub
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
    disk:
      name: jkt48hub-data
      mountPath: /var/data
      sizeGB: 1
